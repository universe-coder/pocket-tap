name: release
# Push a tag like v1.0.0, or run the workflow by hand with a version, to publish
# a GitHub Release with the Windows program attached. Running it by hand without
# a version only builds the program (see the run's artifacts).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create, e.g. v1.0.0 (empty: build only)"
        required: false

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt pyinstaller
      - run: python -m pytest -q
      - name: Build PocketTap-windows.exe
        run: >
          pyinstaller --onefile --windowed --name PocketTap-windows
          --paths .
          --icon packaging/pockettap.ico
          --add-data "pc_remote/static;pc_remote/static"
          --hidden-import pynput.keyboard._win32
          --hidden-import pynput.mouse._win32
          --hidden-import pystray._win32
          packaging/launcher.py
      - name: Smoke test
        shell: pwsh
        run: |
          # A window build has no console, so check the exit code rather than the output.
          $p = Start-Process -FilePath dist\PocketTap-windows.exe -ArgumentList "--version" -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
          $p = Start-Process -FilePath dist\PocketTap-windows.exe -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: PocketTap-windows
          path: dist/PocketTap-windows.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/PocketTap-windows.exe
          generate_release_notes: true
