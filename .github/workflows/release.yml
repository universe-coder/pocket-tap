name: release
# Push a tag like v1.0.0 to publish a GitHub Release with the Windows program
# attached. Running the workflow by hand only builds it (see the run's artifacts).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt pyinstaller
      - run: python -m pytest -q
      - name: Build TapRemote-windows.exe
        run: >
          pyinstaller --onefile --name TapRemote-windows
          --paths .
          --add-data "pc_remote/static;pc_remote/static"
          --hidden-import pynput.keyboard._win32
          --hidden-import pynput.mouse._win32
          packaging/launcher.py
      - name: Smoke test
        shell: pwsh
        run: |
          $out = dist\TapRemote-windows.exe --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $out
      - uses: actions/upload-artifact@v4
        with:
          name: TapRemote-windows
          path: dist/TapRemote-windows.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TapRemote-windows.exe
          generate_release_notes: true
